[package]
name = "kvm-macos"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "macOS native input, output, display, and permission backend for Software KVM"

[dependencies]
kvm-daemon = { path = "../kvm-daemon" }
kvm-input = { path = "../kvm-input" }
kvm-types = { path = "../kvm-types" }
sha2 = "0.11"
thiserror = "2"

# This crate is the narrow native boundary. The workspace denies unsafe code by
# default; macOS framework calls are reviewed here and each unsafe block carries
# a local SAFETY justification.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
