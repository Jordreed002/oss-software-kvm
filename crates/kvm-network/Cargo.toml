[package]
name = "kvm-network"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Authenticated-stream transport primitives for Software KVM"

[dependencies]
kvm-protocol = { path = "../kvm-protocol" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
zeroize = "1"

[dev-dependencies]
rcgen = "0.14"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }

[[bench]]
name = "outbound_queue"
harness = false

[[bench]]
name = "tls_record"
harness = false

[lints]
workspace = true
