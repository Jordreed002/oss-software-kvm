[package]
name = "kvm-network"
version = "0.1.0"
edition = "2021"
description = "Authenticated-stream transport primitives for Software KVM"

[dependencies]
kvm-protocol = { path = "../kvm-protocol" }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
