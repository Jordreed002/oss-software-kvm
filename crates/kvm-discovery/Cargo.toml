[package]
name = "kvm-discovery"
version = "0.1.0"
edition = "2021"
description = "Bounded untrusted LAN reachability discovery for Software KVM"

[dependencies]
kvm-types = { path = "../kvm-types" }
mdns-sd = "=0.20.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
