[package]
name = "kvm-protocol"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Versioned wire protocol and framing for Software KVM"

[dependencies]
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "frame_codec"
harness = false

[[bench]]
name = "frame_roundtrip"
harness = false

[lints]
workspace = true
