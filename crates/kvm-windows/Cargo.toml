[package]
name = "kvm-windows"
version = "0.1.0"
edition = "2021"
description = "Windows native input, injection, and display backend for Software KVM"

[dependencies]
kvm-daemon = { path = "../kvm-daemon" }
kvm-input = { path = "../kvm-input" }
kvm-types = { path = "../kvm-types" }
sha2 = "0.11"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
