[package]
name = "kvm-daemon"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Production daemon lifecycle and safety coordinator for Software KVM"

[dependencies]
arc-swap = "1"
kvm-config = { path = "../kvm-config" }
kvm-discovery = { path = "../kvm-discovery" }
kvm-input = { path = "../kvm-input" }
kvm-network = { path = "../kvm-network" }
kvm-protocol = { path = "../kvm-protocol" }
kvm-router = { path = "../kvm-router" }
kvm-security = { path = "../kvm-security" }
kvm-topology = { path = "../kvm-topology" }
kvm-types = { path = "../kvm-types" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = []
## Development-only diagnostics: compiles in the §35 input-event-rate meter and
## the §36 capture→injection latency instrumentation from kvm-input, and wires
## them onto the daemon's hot paths. Off by default so release builds pay
## nothing. Forwards to kvm-input's `event-rate` and `latency` features.
diagnostics = ["kvm-input/event-rate", "kvm-input/latency"]

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
