[package]
name = "kvm-input"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Platform-neutral input model and state tracking for Software KVM"

[dependencies]
kvm-types = { path = "../kvm-types" }
serde = { version = "1", features = ["derive"] }

[features]
default = []
## Development-only capture→injection latency instrumentation (spec §36).
## Off by default: enabling it compiles the `instrumentation` module and lets
## call sites stamp input events at the five lifecycle stages. It performs no
## disk I/O and never touches the real-time input path when disabled.
latency = []
## Development-only input-event-rate instrumentation (spec §35 "input event
## rate"). Off by default: compiles the `event_rate` module with a lock-free
## sliding-window meter. No disk I/O; a single atomic RMW per recorded event.
event-rate = []

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
