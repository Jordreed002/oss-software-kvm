[package]
name = "software-kvm-control-panel"
version = "0.1.0"
description = "Local setup and control panel for Software KVM"
edition = "2021"

[lib]
name = "software_kvm_control_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "software-kvm-control-panel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
fs2 = "0.4"
hex = "0.4"
hostname = "0.4"
if-addrs = "0.14"
kvm-config = { path = "../../../crates/kvm-config" }
kvm-daemon = { path = "../../../crates/kvm-daemon" }
kvm-runtime = { path = "../../../crates/kvm-runtime" }
kvm-types = { path = "../../../crates/kvm-types" }
rcgen = "0.14"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = [] }
toml = "1.1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
kvm-windows = { path = "../../../crates/kvm-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
kvm-macos = { path = "../../../crates/kvm-macos" }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
