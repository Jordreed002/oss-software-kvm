name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets
      # The diagnostics subsystem (spec §35/§36) is feature-gated and off by
      # default, so the steps above never compile or test it. Mirror the
      # dev-only feature here so regressions in feature-gated code surface in CI.
      - name: Check lints (diagnostics feature)
        run: cargo clippy --workspace --all-targets --features kvm-daemon/diagnostics -- -D warnings
      - name: Run tests (diagnostics feature)
        run: cargo test --workspace --all-targets --features kvm-daemon/diagnostics
