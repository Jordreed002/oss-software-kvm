# cargo-deny configuration
#
# Enforced in CI by the `cargo-deny` job (EmbarkStudios/cargo-deny-action@v2,
# which defaults to `cargo deny --manifest-path /Cargo.toml check`). Advisories
# are strict; duplicate crate versions are only a warning while the dependency
# tree is still young.

[graph]
# Include the feature-gated diagnostics subsystem in the checked graph.
all-features = true

[advisories]
# RUSTSEC vulnerability advisories always fail the check (not configurable).
# Also fail on unmaintained and unsound crates at any dependency depth, and on
# yanked versions. Use `ignore` entries with a reason for scoped exceptions.
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    # Transitive via postcard -> heapless 0.7 (kvm-protocol uses postcard for
    # wire framing). No safe upgrade exists: postcard 1.x still pulls heapless
    # 0.7, and the crate is archived rather than vulnerable. Revisit when
    # postcard drops heapless 0.7.
    { id = "RUSTSEC-2023-0089", reason = "unmaintained transitive via postcard/heapless; no safe upgrade available" },
]

[licenses]
# Permissive allowlist. Extend deliberately when a new dependency needs an
# additional license; do not widen to a catch-all.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
]

# ring's Cargo.toml uses a license expression ("LicenseRef-ring") that SPDX
# cannot parse; its actual licensing is MIT AND ISC AND OpenSSL.
[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Duplicate versions are expected while the tree is young; surface them as
# warnings instead of failing the build.
multiple-versions = "warn"
# Every wildcard dependency in this workspace is an intra-workspace path
# dependency (kvm-* crates reference each other by path without a version).
# Registry dependencies are still pinned through Cargo.lock and the sources
# check.
wildcards = "allow"

[sources]
# Only crates.io-registry dependencies are allowed; no arbitrary git or URL
# dependencies may enter the graph unnoticed.
unknown-registry = "deny"
unknown-git = "deny"
